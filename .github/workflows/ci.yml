name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# A newer run on the same ref cancels the one in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # The preset names the tree, build/<preset>, and the build type; the
        # same commands build it on a laptop (CMakePresets.json). The guard in
        # CMakeLists.txt stops a runner of another architecture at Configure.
        include:
          - os: ubuntu-latest
            preset: relwithdebinfo-linux-x86_64
          - os: macos-latest
            preset: relwithdebinfo-macos-arm64
    runs-on: ${{ matrix.os }}
    # Far above a normal run; the bound is for a hung test, which otherwise
    # runs until GitHub's six-hour job cap.
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6

    - name: Tool versions
      run: |
        cmake --version | head -1
        c++ --version | head -1

    # -Werror=author -Werror=deprecated: any CMake author or deprecation warning,
    # ours or a dependency's, fails the run. "author" is CMake 4.4's name for
    # "dev", whose old spelling prints a deprecation notice there. A CMake before
    # 4.4 would ignore -Werror=author without a word, so what makes it bite is the
    # runners' CMake, which Tool versions above prints; test_cmake_diagnostics
    # holds the spelling and the effect (flywheel-dag#59). FLYWHEEL_DAG_WARNINGS_AS_ERRORS
    # makes any compiler warning in this project's own code fail it too; the
    # dependencies' sources keep their own flags. The build type is the preset's:
    # relwithdebinfo is RelWithDebInfo, the project's own default, the
    # configuration consumers get.
    - name: Configure
      run: cmake --preset ${{ matrix.preset }} -Werror=author -Werror=deprecated -DFLYWHEEL_DAG_WARNINGS_AS_ERRORS=ON

    - name: Build
      run: cmake --build --preset ${{ matrix.preset }} --parallel 4

    # The test preset passes --output-on-failure and --timeout 120, which bounds
    # each test that does not set its own TIMEOUT, and fails a run that finds no
    # tests.
    - name: Test
      run: ctest --preset ${{ matrix.preset }}

    # The benchmark is EXCLUDE_FROM_ALL, so this step is what keeps it
    # compiling. Its timings are printed and never compared: a shared runner's
    # clock proves nothing. Its exact columns (allocs/cycle, callbacks and
    # checksum) must match the committed file. The output goes to a file first,
    # so a crash fails the step rather than feeding diff a short input.
    - name: Benchmark
      run: |
        cmake --build --preset ${{ matrix.preset }} --target bench_hot_path
        ./build/${{ matrix.preset }}/bin/bench_hot_path
        ./build/${{ matrix.preset }}/bin/bench_hot_path --invariants > bench_invariants.txt
        diff -u benchmarks/expected_invariants.txt bench_invariants.txt
