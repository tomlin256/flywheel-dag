name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# A newer run on the same ref cancels the one in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }}, ${{ matrix.preset }}${{ matrix.cmake && format(', CMake {0}', matrix.cmake) || '' }})
    strategy:
      fail-fast: false
      matrix:
        # The preset names the tree, build/<preset>, and the build type; the
        # same commands build it on a laptop (CMakePresets.json). The guard in
        # CMakeLists.txt stops a runner of another architecture at Configure.
        include:
          - os: ubuntu-latest
            preset: relwithdebinfo-linux-x86_64
          # The same build on the CMake floor, the oldest CMake the project asks for
          # (CMakeLists.txt, README.md; test_cmake_floor holds them to one number). The
          # runners' own CMake is several minor releases above it, so without this job
          # the floor is only what someone ran by hand. 4.0.7 is the last 4.0 release;
          # the SHA-256 is Kitware's, from the release's cmake-4.0.7-SHA-256.txt.
          - os: ubuntu-latest
            preset: relwithdebinfo-linux-x86_64
            cmake: 4.0.7
            cmake_sha256: dba36a8e7898e02c3a66dbe169dc776ffc81c2ee6d5bcab3c526d3f3976b4e91
          - os: macos-latest
            preset: relwithdebinfo-macos-arm64
    runs-on: ${{ matrix.os }}
    # Far above a normal run; the bound is for a hung test, which otherwise
    # runs until GitHub's six-hour job cap.
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6

    # The floor job puts Kitware's release first on PATH, after checking it.
    - name: Install the CMake floor
      if: matrix.cmake
      run: |
        tarball=cmake-${{ matrix.cmake }}-linux-x86_64.tar.gz
        curl -fsSL -o "$tarball" "https://github.com/Kitware/CMake/releases/download/v${{ matrix.cmake }}/$tarball"
        echo "${{ matrix.cmake_sha256 }}  $tarball" | sha256sum -c -
        mkdir "$RUNNER_TEMP/cmake"
        tar -xzf "$tarball" -C "$RUNNER_TEMP/cmake" --strip-components=1
        echo "$RUNNER_TEMP/cmake/bin" >> "$GITHUB_PATH"

    - name: Tool versions
      run: |
        cmake --version | head -1
        c++ --version | head -1

    # -Werror=dev -Werror=deprecated: any CMake developer or deprecation warning,
    # ours or a dependency's, fails the run. FLYWHEEL_DAG_WARNINGS_AS_ERRORS
    # makes any compiler warning in this project's own code fail it too; the
    # dependencies' sources keep their own flags. The build type is the preset's:
    # relwithdebinfo is RelWithDebInfo, the project's own default, the
    # configuration consumers get.
    - name: Configure
      run: cmake --preset ${{ matrix.preset }} -Werror=dev -Werror=deprecated -DFLYWHEEL_DAG_WARNINGS_AS_ERRORS=ON

    - name: Build
      run: cmake --build --preset ${{ matrix.preset }} --parallel 4

    # The test preset passes --output-on-failure and --timeout 120, which bounds
    # each test that does not set its own TIMEOUT, and fails a run that finds no
    # tests.
    - name: Test
      run: ctest --preset ${{ matrix.preset }}

    # The benchmark is EXCLUDE_FROM_ALL, so this step is what keeps it
    # compiling. Its timings are printed and never compared: a shared runner's
    # clock proves nothing. Its exact columns (allocs/cycle, callbacks and
    # checksum) must match the committed file. The output goes to a file first,
    # so a crash fails the step rather than feeding diff a short input.
    - name: Benchmark
      run: |
        cmake --build --preset ${{ matrix.preset }} --target bench_hot_path
        ./build/${{ matrix.preset }}/bin/bench_hot_path
        ./build/${{ matrix.preset }}/bin/bench_hot_path --invariants > bench_invariants.txt
        diff -u benchmarks/expected_invariants.txt bench_invariants.txt
