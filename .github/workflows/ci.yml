name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# A newer run on the same ref cancels the one in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    # Far above a normal run; the bound is for a hung test, which otherwise
    # runs until GitHub's six-hour job cap.
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6

    # -Werror=dev -Werror=deprecated: any CMake developer or deprecation warning,
    # ours or a dependency's, fails the run. FLYWHEEL_DAG_WARNINGS_AS_ERRORS
    # makes any compiler warning in this project's own code fail it too; the
    # dependencies' sources keep their own flags. The build type is left to the
    # project's own default (RelWithDebInfo), the configuration consumers get.
    - name: Configure
      run: cmake -B build -Werror=dev -Werror=deprecated -DFLYWHEEL_DAG_WARNINGS_AS_ERRORS=ON

    - name: Build
      run: cmake --build build --parallel 4

    # --timeout bounds each test that does not set its own TIMEOUT.
    - name: Test
      working-directory: build
      run: ctest --output-on-failure --timeout 120

    # The benchmark is EXCLUDE_FROM_ALL, so this step is what keeps it
    # compiling. Its timings are printed and never compared: a shared runner's
    # clock proves nothing. Its exact columns (allocs/cycle, callbacks and
    # checksum) must match the committed file. The output goes to a file first,
    # so a crash fails the step rather than feeding diff a short input.
    - name: Benchmark
      run: |
        cmake --build build --target bench_hot_path
        ./build/bin/bench_hot_path
        ./build/bin/bench_hot_path --invariants > bench_invariants.txt
        diff -u benchmarks/expected_invariants.txt bench_invariants.txt
